<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 623 251" width="623" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="72" rows="10"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }

            :root {
                --animation-duration: 3158ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
1.108%{transform:translateY(-204px)}
8.708%{transform:translateY(-408px)}
16.339%{transform:translateY(-612px)}
20.139%{transform:translateY(-816px)}
30.272%{transform:translateY(-1020px)}
40.437%{transform:translateY(-1224px)}
50.570%{transform:translateY(-1428px)}
59.436%{transform:translateY(-1632px)}
68.334%{transform:translateY(-1836px)}
100.000%{transform:translateY(-1836px)}
            }

            #screen_view {
                animation-duration: 3158ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
            /* The colors defined below are the default 16 colors used for rendering text of the terminal. Adjust
