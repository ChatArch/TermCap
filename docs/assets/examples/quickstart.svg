            .color6 {fill: #a1efe4}
            .color7 {fill: #f8f8f2}
            .color8 {fill: #75715e}
            .color9 {fill: #fd971f}
            .color10 {fill: #383830}
            .color11 {fill: #49483e}
            .color12 {fill: #a59f85}
            .color13 {fill: #f5f4f1}
            .color14 {fill: #cc6633}
            .color15 {fill: #f9f8f5}
        </style>
    </defs>
    <rect id="terminalui" class="background" width="100%" height="100%" ry="4.5826941"/>
    <circle cx="24" cy="23" r="7" class="color1"/>
