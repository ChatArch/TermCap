<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 623 217" width="623" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="72" rows="8"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }

            :root {
                --animation-duration: 3157ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
1.077%{transform:translateY(-170px)}
8.711%{transform:translateY(-340px)}
16.313%{transform:translateY(-510px)}
20.146%{transform:translateY(-680px)}
30.282%{transform:translateY(-850px)}
40.418%{transform:translateY(-1020px)}
50.586%{transform:translateY(-1190px)}
59.455%{transform:translateY(-1360px)}
68.324%{transform:translateY(-1530px)}
100.000%{transform:translateY(-1530px)}
            }

            #screen_view {
                animation-duration: 3157ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
            /* The colors defined below are the default 16 colors used for rendering text of the terminal. Adjust
