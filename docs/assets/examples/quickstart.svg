            .color9 {fill: #fd971f}
            .color10 {fill: #383830}
            .color11 {fill: #49483e}
            .color12 {fill: #a59f85}
            .color13 {fill: #f5f4f1}
            .color14 {fill: #cc6633}
            .color15 {fill: #f9f8f5}
        </style>
    </defs>
